<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temporary Journey Tracker</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <h1>Temporary Journey Tracker</h1>
    <p class="muted">Record a journey and its start, waypoint, and end milestones.</p>
    <form id="journey-form">
      <label for="name">Journey name</label>
      <div class="row"><input id="name" name="name" required placeholder="e.g. Home to office"><button>Add journey</button></div>
      <p id="message" role="status"></p>
    </form>
    <section><h2>Journeys</h2><div id="journeys"><p class="muted">Loading…</p></div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
